<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Etapa de Áudio</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 0;
      color: #1f2937;
    }
    .container {
      max-width: 760px;
      margin: 40px auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
      padding: 28px;
    }
    h1 {
      margin-top: 0;
      font-size: 28px;
    }
    .card {
      background: #eff6ff;
      border: 1px solid #93c5fd;
      color: #1e3a8a;
      border-radius: 10px;
      padding: 18px;
      line-height: 1.55;
      margin: 18px 0;
    }
    .status {
      margin-top: 18px;
      font-size: 14px;
      color: #475569;
    }
    .error {
      color: #b91c1c;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 12px;
      margin-top: 18px;
    }
    a.button {
      display: inline-block;
      margin-top: 18px;
      background: #2563eb;
      color: #fff;
      text-decoration: none;
      padding: 12px 18px;
      border-radius: 8px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Etapa final da pesquisa</h1>

    <div class="card">
      Você será direcionado(a) para a etapa de gravação de áudio.
      São <strong>11 gravações</strong>: uma tarefa de contagem e 10 respostas narrativas.
    </div>

    <div id="status" class="status">Preparando a etapa de áudio...</div>
    <div id="error"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const draftId = params.get('draftId');
    const participantId = params.get('participantId');

    const statusEl = document.getElementById('status');
    const errorEl = document.getElementById('error');

    if (!draftId || !participantId) {
      statusEl.textContent = '';
      errorEl.innerHTML = '<div class="error">Não foi possível identificar sua sessão. Volte ao questionário e tente novamente.</div>';
    } else {
      const destino =
        './audio.html' +
        '?draftId=' + encodeURIComponent(draftId) +
        '&participantId=' + encodeURIComponent(participantId);

      statusEl.textContent = 'Redirecionando...';
      window.location.replace(destino);
    }
  </script>
</body>
</html>
