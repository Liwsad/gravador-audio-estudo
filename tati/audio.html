<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gravação de Áudio</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 0;
      color: #1f2937;
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
      padding: 28px;
    }

    h1 {
      margin-top: 0;
      font-size: 28px;
    }

    .intro {
      background: #eef2ff;
      border-left: 5px solid #4f46e5;
      padding: 16px;
      border-radius: 8px;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .progress {
      background: #eff6ff;
      border: 1px solid #93c5fd;
      color: #1e40af;
      border-radius: 10px;
      padding: 14px 16px;
      font-weight: 700;
      margin: 18px 0;
    }

    .task {
      margin-bottom: 22px;
      padding: 18px;
      background: #fafafa;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
    }

    .task.saved {
      border-color: #10b981;
      background: #f0fdf4;
    }

    .question {
      font-weight: 700;
      line-height: 1.5;
      margin-bottom: 10px;
    }

    .hint {
      font-size: 13px;
      color: #6b7280;
      margin-top: 8px;
      line-height: 1.45;
    }

    .status {
      font-size: 14px;
      font-weight: 600;
      margin: 8px 0;
      min-height: 20px;
    }

    .timer {
      display: none;
      font-size: 22px;
      font-weight: 700;
      color: #dc2626;
      letter-spacing: 2px;
      margin: 8px 0;
    }

    .timer.active {
      display: block;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 12px 16px;
      cursor: pointer;
      font-size: 15px;
    }

    .btn-primary {
      background: #2563eb;
      color: white;
    }

    .btn-danger {
      background: #dc2626;
      color: white;
    }

    .btn-secondary {
      background: #64748b;
      color: white;
    }

    .hidden {
      display: none !important;
    }

    audio {
      width: 100%;
      margin-top: 10px;
    }

    .upload {
      margin-top: 8px;
      color: #2563eb;
      font-size: 13px;
    }

    .success {
      background: #ecfdf5;
      border: 1px solid #10b981;
      color: #065f46;
      border-radius: 10px;
      padding: 16px;
      margin-top: 20px;
      line-height: 1.5;
    }

    .error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
      border-radius: 10px;
      padding: 14px;
      margin-top: 16px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
<div class="container">
  <h1>Gravação de áudio</h1>

  <div class="intro">
    Agora vamos realizar a etapa final da pesquisa. Grave cada resposta separadamente.
    Depois de parar uma gravação, o arquivo será enviado automaticamente ao servidor.
    Se quiser refazer, use o botão <strong>Regravar</strong>.
  </div>

  <div id="progress" class="progress">Áudios concluídos: 0 de 11</div>
  <div id="tasks"></div>
  <div id="globalMessage"></div>
</div>

<script>
const APP_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw_-bJCkJT-Rw09jqI97eagxIqylTMXUTNlj2H3-Xzr8R9iq3msJII7tduyx1O_Sa9l/exec';

const params = new URLSearchParams(window.location.search);
const draftId = params.get('draftId');
const participantId = params.get('participantId');

const AUDIO_TASKS = [
  {
    item: 'Audio_Contagem',
    bloco: 'Áudios Narrativos',
    pergunta: 'Agora vamos gravar um áudio breve. Por favor, grave-se contando de 1 a 10 em voz alta, em ritmo natural de fala, como se estivesse contando normalmente. A gravação deve durar cerca de 10 segundos.'
  },
  {
    item: 'AudioNarr_01',
    bloco: 'Áudios Narrativos',
    pergunta: 'De que forma você sente, no seu corpo ou na sua saúde, os impactos das mudanças ambientais?'
  },
  {
    item: 'AudioNarr_02',
    bloco: 'Áudios Narrativos',
    pergunta: 'Você sente que pode fazer algo para mudar ou amenizar os problemas ambientais? Por quê?'
  },
  {
    item: 'AudioNarr_03',
    bloco: 'Áudios Narrativos',
    pergunta: 'Conte uma lembrança especial de um momento em que você se sentiu conectado à natureza.'
  },
  {
    item: 'AudioNarr_04',
    bloco: 'Áudios Narrativos',
    pergunta: 'Você sente que sua relação com a natureza mudou nos últimos anos? Como?'
  },
  {
    item: 'AudioNarr_05',
    bloco: 'Áudios Narrativos',
    pergunta: 'Quando você pensa no futuro do planeta, o que sente?'
  },
  {
    item: 'AudioNarr_06',
    bloco: 'Áudios Narrativos',
    pergunta: 'Na sua opinião, de quem é a responsabilidade por cuidar do meio ambiente?'
  },
  {
    item: 'AudioNarr_07',
    bloco: 'Áudios Narrativos',
    pergunta: 'Você sente que faz parte da natureza ou do ambiente onde vive? Como isso influencia sua vida?'
  },
  {
    item: 'AudioNarr_08',
    bloco: 'Áudios Narrativos',
    pergunta: 'Quais mudanças ambientais você percebeu no lugar onde você vive nos últimos anos?'
  },
  {
    item: 'AudioNarr_09',
    bloco: 'Áudios Narrativos',
    pergunta: 'Como você se sente em relação ao futuro das próximas gerações, diante das mudanças ambientais?'
  },
  {
    item: 'AudioNarr_10',
    bloco: 'Áudios Narrativos',
    pergunta: 'Qual é a primeira emoção ou sentimento que vem à sua mente quando você pensa na destruição ambiental?'
  }
];

const state = {
  saved: new Set(),
  recorders: {},
  previewUrls: {}
};

document.addEventListener('DOMContentLoaded', async function () {
  if (!draftId || !participantId) {
    showGlobalError('Sessão inválida. Volte ao questionário e tente novamente.');
    return;
  }

  renderTasks();
  await carregarAudiosSalvos();
  updateProgress();
});

function renderTasks() {
  const root = document.getElementById('tasks');
  root.innerHTML = '';

  AUDIO_TASKS.forEach(function (task, index) {
    const sid = sanitizeId(task.item);
    const div = document.createElement('div');
    div.className = 'task';
    div.id = 'task_' + sid;

    const numero = document.createElement('div');
    numero.className = 'hint';
    numero.textContent = 'Áudio ' + (index + 1) + ' de ' + AUDIO_TASKS.length;
    div.appendChild(numero);

    const q = document.createElement('div');
    q.className = 'question';
    q.textContent = task.pergunta;
    div.appendChild(q);

    if (task.item !== 'Audio_Contagem') {
      const h = document.createElement('div');
      h.className = 'hint';
      h.textContent = 'Sugestão: responda livremente, em aproximadamente 30 segundos a 2 minutos.';
      div.appendChild(h);
    }

    const status = document.createElement('div');
    status.className = 'status';
    status.id = 'status_' + sid;
    status.textContent = 'Nenhum áudio gravado.';
    div.appendChild(status);

    const timer = document.createElement('div');
    timer.className = 'timer';
    timer.id = 'timer_' + sid;
    timer.textContent = '00:00';
    div.appendChild(timer);

    const preview = document.createElement('audio');
    preview.controls = true;
    preview.className = 'hidden';
    preview.id = 'preview_' + sid;
    div.appendChild(preview);

    const upload = document.createElement('div');
    upload.className = 'upload hidden';
    upload.id = 'upload_' + sid;
    upload.textContent = 'Enviando áudio ao servidor...';
    div.appendChild(upload);

    const controls = document.createElement('div');
    controls.className = 'controls';

    const startBtn = document.createElement('button');
    startBtn.type = 'button';
    startBtn.className = 'btn-primary';
    startBtn.id = 'start_' + sid;
    startBtn.textContent = '🎙️ Iniciar gravação';
    startBtn.onclick = function () { startRecording(task.item); };

    const stopBtn = document.createElement('button');
    stopBtn.type = 'button';
    stopBtn.className = 'btn-danger hidden';
    stopBtn.id = 'stop_' + sid;
    stopBtn.textContent = '⏹ Parar gravação';
    stopBtn.onclick = function () { stopRecording(task.item); };

    const redoBtn = document.createElement('button');
    redoBtn.type = 'button';
    redoBtn.className = 'btn-secondary hidden';
    redoBtn.id = 'redo_' + sid;
    redoBtn.textContent = '🔄 Regravar';
    redoBtn.onclick = function () { redoRecording(task.item); };

    controls.appendChild(startBtn);
    controls.appendChild(stopBtn);
    controls.appendChild(redoBtn);

    div.appendChild(controls);
    root.appendChild(div);
  });
}

async function api(payload) {
  const response = await fetch(APP_SCRIPT_URL, {
    method: 'POST',
    headers: {
      'Content-Type': 'text/plain;charset=utf-8'
    },
    body: JSON.stringify(payload)
  });

  if (!response.ok) {
    throw new Error('Falha de comunicação com o servidor.');
  }

  return await response.json();
}

async function carregarAudiosSalvos() {
  try {
    const res = await api({
      action: 'listarAudios',
      draftId: draftId,
      participantId: participantId
    });

    if (!res || res.status !== 'sucesso') return;

    (res.itens || []).forEach(function (item) {
      state.saved.add(item);
      markSaved(item);
    });
  } catch (e) {
    console.warn('Não foi possível consultar áudios já salvos:', e);
  }
}

async function startRecording(item) {
  const sid = sanitizeId(item);

  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    setStatus(item, 'Não foi possível acessar o microfone. Verifique a permissão do navegador.');
    return;
  }

  const preferred = [
    'audio/webm;codecs=opus',
    'audio/webm',
    'audio/mp4',
    'audio/ogg'
  ].find(function (type) {
    return window.MediaRecorder &&
           typeof MediaRecorder.isTypeSupported === 'function' &&
           MediaRecorder.isTypeSupported(type);
  }) || '';

  let recorder;
  try {
    recorder = preferred
      ? new MediaRecorder(stream, { mimeType: preferred })
      : new MediaRecorder(stream);
  } catch (e) {
    stream.getTracks().forEach(function (track) { track.stop(); });
    setStatus(item, 'Seu navegador não conseguiu iniciar a gravação.');
    return;
  }

  const chunks = [];
  let seconds = 0;

  recorder.ondataavailable = function (event) {
    if (event.data && event.data.size > 0) chunks.push(event.data);
  };

  recorder.onstop = function () {
    finishRecording(item, chunks, recorder.mimeType || preferred || 'audio/webm', stream);
  };

  recorder.start(1000);

  const timerEl = document.getElementById('timer_' + sid);
  timerEl.textContent = '00:00';
  timerEl.classList.add('active');

  const interval = setInterval(function () {
    seconds += 1;
    const min = String(Math.floor(seconds / 60)).padStart(2, '0');
    const sec = String(seconds % 60).padStart(2, '0');
    timerEl.textContent = min + ':' + sec;
  }, 1000);

  state.recorders[item] = {
    recorder: recorder,
    stream: stream,
    timerInterval: interval
  };

  document.getElementById('start_' + sid).classList.add('hidden');
  document.getElementById('stop_' + sid).classList.remove('hidden');
  document.getElementById('redo_' + sid).classList.add('hidden');

  setStatus(item, '🔴 Gravando...');
}

function stopRecording(item) {
  const rec = state.recorders[item];
  if (!rec) return;

  clearInterval(rec.timerInterval);

  if (rec.recorder && rec.recorder.state !== 'inactive') {
    rec.recorder.stop();
  }

  document.getElementById('stop_' + sanitizeId(item)).classList.add('hidden');
  setStatus(item, 'Processando áudio...');
}

function finishRecording(item, chunks, mimeType, stream) {
  stream.getTracks().forEach(function (track) {
    track.stop();
  });

  const sid = sanitizeId(item);
  document.getElementById('timer_' + sid).classList.remove('active');

  const blob = new Blob(chunks, { type: mimeType });

  if (!blob.size) {
    setStatus(item, 'A gravação ficou vazia. Tente novamente.');
    document.getElementById('start_' + sid).classList.remove('hidden');
    return;
  }

  if (state.previewUrls[item]) {
    URL.revokeObjectURL(state.previewUrls[item]);
  }

  const previewUrl = URL.createObjectURL(blob);
  state.previewUrls[item] = previewUrl;

  const preview = document.getElementById('preview_' + sid);
  preview.src = previewUrl;
  preview.classList.remove('hidden');

  const reader = new FileReader();

  reader.onloadend = async function () {
    const audioData = reader.result;

    document.getElementById('upload_' + sid).classList.remove('hidden');
    setStatus(item, 'Enviando áudio ao servidor...');

    try {
      const res = await api({
        action: 'salvarAudio',
        draftId: draftId,
        participantId: participantId,
        item: item,
        audioData: audioData,
        mimeType: mimeType
      });

      document.getElementById('upload_' + sid).classList.add('hidden');

      if (!res || res.status !== 'sucesso') {
        throw new Error(res && res.message ? res.message : 'Erro desconhecido.');
      }

      state.saved.add(item);
      markSaved(item);
      updateProgress();

      if (state.saved.size === AUDIO_TASKS.length) {
        await concluirSubmissao();
      }
    } catch (e) {
      document.getElementById('upload_' + sid).classList.add('hidden');
      setStatus(item, 'Falha ao salvar o áudio: ' + e.message);
      document.getElementById('start_' + sid).classList.remove('hidden');
      document.getElementById('redo_' + sid).classList.remove('hidden');
    }
  };

  reader.readAsDataURL(blob);
}

async function redoRecording(item) {
  const sid = sanitizeId(item);

  try {
    if (state.saved.has(item)) {
      await api({
        action: 'excluirAudio',
        draftId: draftId,
        participantId: participantId,
        item: item
      });
    }
  } catch (e) {
    console.warn('Falha ao excluir áudio anterior:', e);
  }

  state.saved.delete(item);

  const preview = document.getElementById('preview_' + sid);
  preview.src = '';
  preview.classList.add('hidden');

  if (state.previewUrls[item]) {
    URL.revokeObjectURL(state.previewUrls[item]);
    delete state.previewUrls[item];
  }

  document.getElementById('start_' + sid).classList.remove('hidden');
  document.getElementById('stop_' + sid).classList.add('hidden');
  document.getElementById('redo_' + sid).classList.add('hidden');

  document.getElementById('task_' + sid).classList.remove('saved');

  setStatus(item, 'Nenhum áudio gravado.');
  updateProgress();
}

function markSaved(item) {
  const sid = sanitizeId(item);

  document.getElementById('task_' + sid).classList.add('saved');
  document.getElementById('start_' + sid).classList.add('hidden');
  document.getElementById('stop_' + sid).classList.add('hidden');
  document.getElementById('redo_' + sid).classList.remove('hidden');

  setStatus(item, '✅ Áudio salvo com sucesso.');
}

function updateProgress() {
  const count = AUDIO_TASKS.filter(function (task) {
    return state.saved.has(task.item);
  }).length;

  document.getElementById('progress').textContent =
    'Áudios concluídos: ' + count + ' de ' + AUDIO_TASKS.length;
}

async function concluirSubmissao() {
  const msg = document.getElementById('globalMessage');

  if (msg.dataset.finalizando === '1') return;
  msg.dataset.finalizando = '1';

  msg.innerHTML =
    '<div class="success">Todos os áudios foram enviados. Finalizando sua participação...</div>';

  try {
    const res = await api({
      action: 'salvarSubmissao',
      draftId: draftId,
      participantId: participantId,
      respostas: {},
      audios: Object.fromEntries(
        AUDIO_TASKS.map(function (task) {
          return [task.item, true];
        })
      )
    });

    if (!res || res.status !== 'sucesso') {
      throw new Error(res && res.message ? res.message : 'Erro desconhecido.');
    }

    msg.innerHTML =
      '<div class="success"><strong>Obrigado pela sua participação.</strong><br>' +
      'Suas respostas e seus 11 áudios foram registrados com sucesso.</div>';
  } catch (e) {
    msg.dataset.finalizando = '0';
    msg.innerHTML =
      '<div class="error">Os áudios foram enviados, mas houve uma falha ao finalizar a participação: ' +
      e.message +
      '. Não feche esta página e tente novamente recarregando-a.</div>';
  }
}

function setStatus(item, text) {
  const el = document.getElementById('status_' + sanitizeId(item));
  if (el) el.textContent = text;
}

function showGlobalError(text) {
  document.getElementById('globalMessage').innerHTML =
    '<div class="error">' + text + '</div>';
}

function sanitizeId(value) {
  return String(value).replace(/[^a-zA-Z0-9_-]/g, '_');
}
</script>
</body>
</html>
