<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gravação de Áudio</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 0;
      color: #1f2937;
    }
    .container {
      max-width: 900px;
      margin: 30px auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
      padding: 28px;
    }
    h1 { margin-top: 0; font-size: 28px; }
    .intro {
      background: #eef2ff;
      border-left: 5px solid #4f46e5;
      padding: 16px;
      border-radius: 8px;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .progress {
      background: #eff6ff;
      border: 1px solid #93c5fd;
      color: #1e40af;
      border-radius: 10px;
      padding: 14px 16px;
      font-weight: 700;
      margin: 18px 0;
    }
    .task {
      margin-bottom: 22px;
      padding: 18px;
      background: #fafafa;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
    }
    .task.saved { border-color: #10b981; background: #f0fdf4; }
    .question { font-weight: 700; line-height: 1.5; margin-bottom: 10px; }
    .hint { font-size: 13px; color: #6b7280; margin-top: 8px; line-height: 1.45; }
    .status { font-size: 14px; font-weight: 600; margin: 8px 0; min-height: 20px; }
    .timer {
      display: none;
      font-size: 22px;
      font-weight: 700;
      color: #dc2626;
      letter-spacing: 2px;
      margin: 8px 0;
    }
    .timer.active { display: block; }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
    button {
      border: none;
      border-radius: 8px;
      padding: 12px 16px;
      cursor: pointer;
      font-size: 15px;
    }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-danger { background: #dc2626; color: #fff; }
    .btn-secondary { background: #64748b; color: #fff; }
    .hidden { display: none !important; }
    audio { width: 100%; margin-top: 10px; }
    .upload { margin-top: 8px; color: #2563eb; font-size: 13px; }
    .success {
      background: #ecfdf5;
      border: 1px solid #10b981;
      color: #065f46;
      border-radius: 10px;
      padding: 16px;
      margin-top: 20px;
      line-height: 1.5;
    }
    .error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
      border-radius: 10px;
      padding: 14px;
      margin-top: 16px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>Etapa de gravação de áudio</h1>

  <div class="intro">
    Esta é a etapa final da pesquisa. Serão <strong>11 gravações</strong>.
    Grave cada resposta separadamente. Depois que você parar uma gravação,
    o arquivo será enviado automaticamente. Se quiser substituir uma resposta,
    use <strong>Regravar</strong>.
  </div>

  <div id="progress" class="progress">Áudios concluídos: 0 de 11</div>
  <div id="tasks"></div>
  <div id="globalMessage"></div>
</div>

<script>
const APP_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw_-bJCkJT-Rw09jqI97eagxIqylTMXUTNlj2H3-Xzr8R9iq3msJII7tduyx1O_Sa9l/exec';

const params = new URLSearchParams(window.location.search);
const draftId = params.get('draftId');
const participantId = params.get('participantId');

const AUDIO_TASKS = [
  {
    item: 'Audio_Contagem',
    pergunta: 'Agora vamos gravar um áudio breve. Por favor, grave-se contando de 1 a 10 em voz alta, em ritmo natural de fala, como se estivesse contando normalmente. A gravação deve durar cerca de 10 segundos.'
  },
  {
    item: 'AudioNarr_01',
    pergunta: 'De que forma você sente, no seu corpo ou na sua saúde, os impactos das mudanças ambientais?'
  },
  {
    item: 'AudioNarr_02',
    pergunta: 'Você sente que pode fazer algo para mudar ou amenizar os problemas ambientais? Por quê?'
  },
  {
    item: 'AudioNarr_03',
    pergunta: 'Conte uma lembrança especial de um momento em que você se sentiu conectado à natureza.'
  },
  {
    item: 'AudioNarr_04',
    pergunta: 'Você sente que sua relação com a natureza mudou nos últimos anos? Como?'
  },
  {
    item: 'AudioNarr_05',
    pergunta: 'Quando você pensa no futuro do planeta, o que sente?'
  },
  {
    item: 'AudioNarr_06',
    pergunta: 'Na sua opinião, de quem é a responsabilidade por cuidar do meio ambiente?'
  },
  {
    item: 'AudioNarr_07',
    pergunta: 'Você sente que faz parte da natureza ou do ambiente onde vive? Como isso influencia sua vida?'
  },
  {
    item: 'AudioNarr_08',
    pergunta: 'Quais mudanças ambientais você percebeu no lugar onde você vive nos últimos anos?'
  },
  {
    item: 'AudioNarr_09',
    pergunta: 'Como você se sente em relação ao futuro das próximas gerações, diante das mudanças ambientais?'
  },
  {
    item: 'AudioNarr_10',
    pergunta: 'Qual é a primeira emoção ou sentimento que vem à sua mente quando você pensa na destruição ambiental?'
  }
];

const state = {
  saved: new Set(),
  recorders: {},
  previewUrls: {},
  finalizing: false
};

document.addEventListener('DOMContentLoaded', async () => {
  if (!draftId || !participantId) {
    showGlobalError('Sessão inválida. Volte ao início da pesquisa e tente novamente.');
    disableAllRecording();
    return;
  }

  if (!navigator.mediaDevices || !window.MediaRecorder) {
    showGlobalError('Este navegador não oferece suporte à gravação de áudio necessária para esta pesquisa.');
    disableAllRecording();
    return;
  }

  renderTasks();
  await carregarAudiosSalvos();
  updateProgress();

  if (state.saved.size === AUDIO_TASKS.length) {
    await concluirParticipacao();
  }
});

async function api(payload) {
  const response = await fetch(APP_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });

  if (!response.ok) {
    throw new Error('Falha de comunicação com o servidor.');
  }

  const data = await response.json();

  if (!data || data.status !== 'sucesso') {
    throw new Error(data && (data.message || data.mensagem) ? (data.message || data.mensagem) : 'Erro desconhecido no servidor.');
  }

  return data;
}

function renderTasks() {
  const root = document.getElementById('tasks');
  root.innerHTML = '';

  AUDIO_TASKS.forEach((task, index) => {
    const sid = sanitizeId(task.item);
    const div = document.createElement('div');
    div.className = 'task';
    div.id = 'task_' + sid;

    const n = document.createElement('div');
    n.className = 'hint';
    n.textContent = 'Áudio ' + (index + 1) + ' de ' + AUDIO_TASKS.length;
    div.appendChild(n);

    const q = document.createElement('div');
    q.className = 'question';
    q.textContent = task.pergunta;
    div.appendChild(q);

    if (task.item !== 'Audio_Contagem') {
      const h = document.createElement('div');
      h.className = 'hint';
      h.textContent = 'Responda livremente. Não há necessidade de decorar ou preparar uma resposta.';
      div.appendChild(h);
    }

    const status = document.createElement('div');
    status.className = 'status';
    status.id = 'status_' + sid;
    status.textContent = 'Nenhum áudio gravado.';
    div.appendChild(status);

    const timer = document.createElement('div');
    timer.className = 'timer';
    timer.id = 'timer_' + sid;
    timer.textContent = '00:00';
    div.appendChild(timer);

    const preview = document.createElement('audio');
    preview.controls = true;
    preview.className = 'hidden';
    preview.id = 'preview_' + sid;
    div.appendChild(preview);

    const upload = document.createElement('div');
    upload.className = 'upload hidden';
    upload.id = 'upload_' + sid;
    upload.textContent = 'Enviando áudio ao servidor...';
    div.appendChild(upload);

    const controls = document.createElement('div');
    controls.className = 'controls';

    const start = document.createElement('button');
    start.type = 'button';
    start.className = 'btn-primary';
    start.id = 'start_' + sid;
    start.textContent = '🎙️ Iniciar gravação';
    start.onclick = () => startRecording(task.item);

    const stop = document.createElement('button');
    stop.type = 'button';
    stop.className = 'btn-danger hidden';
    stop.id = 'stop_' + sid;
    stop.textContent = '⏹ Parar gravação';
    stop.onclick = () => stopRecording(task.item);

    const redo = document.createElement('button');
    redo.type = 'button';
    redo.className = 'btn-secondary hidden';
    redo.id = 'redo_' + sid;
    redo.textContent = '🔄 Regravar';
    redo.onclick = () => redoRecording(task.item);

    controls.appendChild(start);
    controls.appendChild(stop);
    controls.appendChild(redo);
    div.appendChild(controls);
    root.appendChild(div);
  });
}

async function carregarAudiosSalvos() {
  try {
    const res = await api({
      action: 'listarAudios',
      draftId,
      participantId
    });

    const itens = Array.isArray(res.itens) ? res.itens : [];
    itens.forEach(item => {
      if (AUDIO_TASKS.some(t => t.item === item)) {
        state.saved.add(item);
        markSaved(item);
      }
    });
  } catch (err) {
    console.warn('Não foi possível consultar os áudios já salvos:', err);
  }
}

async function startRecording(item) {
  const sid = sanitizeId(item);

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

    const candidates = [
      'audio/webm;codecs=opus',
      'audio/webm',
      'audio/mp4',
      'audio/ogg'
    ];

    const mimeType = candidates.find(type =>
      typeof MediaRecorder.isTypeSupported === 'function' &&
      MediaRecorder.isTypeSupported(type)
    ) || '';

    const recorder = mimeType
      ? new MediaRecorder(stream, { mimeType })
      : new MediaRecorder(stream);

    const chunks = [];
    let seconds = 0;

    recorder.ondataavailable = event => {
      if (event.data && event.data.size > 0) chunks.push(event.data);
    };

    recorder.onstop = () => {
      finishRecording(item, chunks, recorder.mimeType || mimeType || 'audio/webm', stream);
    };

    recorder.start(1000);

    const timerEl = document.getElementById('timer_' + sid);
    timerEl.textContent = '00:00';
    timerEl.classList.add('active');

    const interval = setInterval(() => {
      seconds++;
      const min = String(Math.floor(seconds / 60)).padStart(2, '0');
      const sec = String(seconds % 60).padStart(2, '0');
      timerEl.textContent = min + ':' + sec;
    }, 1000);

    state.recorders[item] = { recorder, stream, interval };

    document.getElementById('start_' + sid).classList.add('hidden');
    document.getElementById('redo_' + sid).classList.add('hidden');
    document.getElementById('stop_' + sid).classList.remove('hidden');

    setStatus(item, '🔴 Gravando...');
  } catch (err) {
    setStatus(item, 'Não foi possível acessar o microfone. Verifique a permissão do navegador.');
  }
}

function stopRecording(item) {
  const rec = state.recorders[item];
  if (!rec) return;

  clearInterval(rec.interval);

  if (rec.recorder.state !== 'inactive') {
    rec.recorder.stop();
  }

  document.getElementById('stop_' + sanitizeId(item)).classList.add('hidden');
  setStatus(item, 'Processando áudio...');
}

function finishRecording(item, chunks, mimeType, stream) {
  stream.getTracks().forEach(track => track.stop());
  delete state.recorders[item];

  const sid = sanitizeId(item);
  document.getElementById('timer_' + sid).classList.remove('active');

  const blob = new Blob(chunks, { type: mimeType });

  if (!blob.size) {
    setStatus(item, 'A gravação ficou vazia. Tente novamente.');
    document.getElementById('start_' + sid).classList.remove('hidden');
    return;
  }

  if (state.previewUrls[item]) {
    URL.revokeObjectURL(state.previewUrls[item]);
  }

  const previewUrl = URL.createObjectURL(blob);
  state.previewUrls[item] = previewUrl;

  const preview = document.getElementById('preview_' + sid);
  preview.src = previewUrl;
  preview.classList.remove('hidden');

  uploadBlob(item, blob, mimeType);
}

function uploadBlob(item, blob, mimeType) {
  const sid = sanitizeId(item);
  const reader = new FileReader();

  reader.onloadend = async () => {
    const audioData = reader.result;

    document.getElementById('upload_' + sid).classList.remove('hidden');
    setStatus(item, 'Enviando áudio ao servidor...');

    try {
      await api({
        action: 'salvarAudio',
        draftId,
        participantId,
        item,
        audioData,
        mimeType
      });

      document.getElementById('upload_' + sid).classList.add('hidden');

      state.saved.add(item);
      markSaved(item);
      updateProgress();

      if (state.saved.size === AUDIO_TASKS.length) {
        await concluirParticipacao();
      }
    } catch (err) {
      document.getElementById('upload_' + sid).classList.add('hidden');
      setStatus(item, 'Falha ao salvar o áudio: ' + err.message);
      document.getElementById('start_' + sid).classList.remove('hidden');
      document.getElementById('redo_' + sid).classList.remove('hidden');
    }
  };

  reader.readAsDataURL(blob);
}

async function redoRecording(item) {
  const sid = sanitizeId(item);

  const preview = document.getElementById('preview_' + sid);
  preview.src = '';
  preview.classList.add('hidden');

  if (state.previewUrls[item]) {
    URL.revokeObjectURL(state.previewUrls[item]);
    delete state.previewUrls[item];
  }

  // Não apagamos o arquivo antigo antes da nova gravação.
  // O backend substitui/trasha o anterior somente quando o novo upload chega com sucesso.
  state.saved.delete(item);

  document.getElementById('task_' + sid).classList.remove('saved');
  document.getElementById('start_' + sid).classList.remove('hidden');
  document.getElementById('stop_' + sid).classList.add('hidden');
  document.getElementById('redo_' + sid).classList.add('hidden');

  setStatus(item, 'Pronto para uma nova gravação.');
  updateProgress();
}

function markSaved(item) {
  const sid = sanitizeId(item);
  const task = document.getElementById('task_' + sid);
  if (task) task.classList.add('saved');

  const start = document.getElementById('start_' + sid);
  const stop = document.getElementById('stop_' + sid);
  const redo = document.getElementById('redo_' + sid);

  if (start) start.classList.add('hidden');
  if (stop) stop.classList.add('hidden');
  if (redo) redo.classList.remove('hidden');

  setStatus(item, '✅ Áudio salvo com sucesso.');
}

function updateProgress() {
  const count = AUDIO_TASKS.filter(task => state.saved.has(task.item)).length;
  document.getElementById('progress').textContent =
    'Áudios concluídos: ' + count + ' de ' + AUDIO_TASKS.length;
}

async function concluirParticipacao() {
  if (state.finalizing) return;
  state.finalizing = true;

  const msg = document.getElementById('globalMessage');
  msg.innerHTML =
    '<div class="success">Todos os 11 áudios foram enviados. Finalizando sua participação...</div>';

  try {
    await api({
      action: 'finalizarParticipacao',
      draftId,
      participantId
    });

    msg.innerHTML =
      '<div class="success"><strong>Obrigado pela sua participação.</strong><br>' +
      'Suas respostas e seus 11 áudios foram registrados com sucesso. Você já pode fechar esta página.</div>';

    lockFinishedInterface();
  } catch (err) {
    state.finalizing = false;
    msg.innerHTML =
      '<div class="error">Os 11 áudios foram enviados, mas houve uma falha ao finalizar a participação: ' +
      escapeHtml(err.message) +
      '. Recarregue esta página para tentar a finalização novamente.</div>';
  }
}

function lockFinishedInterface() {
  AUDIO_TASKS.forEach(task => {
    const sid = sanitizeId(task.item);
    const start = document.getElementById('start_' + sid);
    const stop = document.getElementById('stop_' + sid);
    const redo = document.getElementById('redo_' + sid);
    if (start) start.disabled = true;
    if (stop) stop.disabled = true;
    if (redo) redo.disabled = true;
  });
}

function disableAllRecording() {
  document.querySelectorAll('button').forEach(btn => btn.disabled = true);
}

function setStatus(item, text) {
  const el = document.getElementById('status_' + sanitizeId(item));
  if (el) el.textContent = text;
}

function showGlobalError(text) {
  document.getElementById('globalMessage').innerHTML =
    '<div class="error">' + escapeHtml(text) + '</div>';
}

function sanitizeId(value) {
  return String(value).replace(/[^a-zA-Z0-9_-]/g, '_');
}

function escapeHtml(value) {
  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}
</script>
</body>
</html>
